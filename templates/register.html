{% extends 'loginbase.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<main>
    <section class="d-flex align-items-center my-5 mt-lg-6 mb-lg-5">
        <div class="container">
            <div class="col-12 d-flex align-items-center justify-content-center">
                <div class="bg-white shadow-soft border rounded border-light  p-5 p-lg-5 fmxw-650 align-items-center"
                    style="width:60%">
                    <div class="text-center text-md-center mb-4 mt-md-0">
                        <h1 class="mb-0 h3">Create an Account</h1>
                    </div>
                    <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="Proctor">
                    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                    <div class="card-body ">
                        <form action="register" id="myForm" method="POST" class="mt-4">

                            <div class="form-group">
                                <label for="name">NAME</label>
                                <div class="input-group mb-4">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><span class="fas fa-user"></span></span>
                                    </div>
                                    <input name="name" class="form-control" id="name" 
                                        type="text" value="{{ form.get('name', '') if form else '' }}" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email">EMAIL</label>
                                <div class="input-group mb-4">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><span class="fas fa-envelope"></span></span>
                                    </div>
                                    <input name="email" type="email" class="form-control" id="email"
                                        aria-label="email address" value="{{ form.get('email', '') if form else '' }}" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="password">PASSWORD</label>
                                <div class="input-group mb-4">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><span class="fas fa-unlock-alt"></span></span>
                                    </div>
                                    <input name="password" type="text" class="form-control" id="password"
                                        style="-webkit-text-security:disc;" aria-label="Password"
                                        required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="my-1 mr-2" for="inlineFormCustomSelectPref">Choose User Type</label>
                                <select class="custom-select my-1 mr-sm-2" id="inlineFormCustomSelectPref"
                                    name="userType" required>
                                    <option value="student">Student</option>
                                    <option value="teacher">Professor</option>
                                </select>
                            </div>

                            <video id="camera" autoplay muted playsinline width="350" height="260"
                                style="max-width: 100%; background: #111;"></video>
                            <div id="cameraStatus" class="text-muted">Starting camera…</div>
                            <br>
                            <div class="d-flex justify-content-center"" id="results" style="width: 100%;"></div>
                            <br>
                            <button type="button" id="capture" class="btn btn-block btn-secondary">Capture Image</button>
                            

                            <input type="submit" id="myButton" class="btn btn-block btn-primary"
                                value="Proceed to Capture Images">
                        </form>
                        <p>Already have an account?
                            <a href="/login">Click here</a>.
                        </p>
                    </div>
                    <div>
                    </div>
                </div>
            </div>
        </div>
        </div>
        </div>
        </div>
    </section>
</main>

<script>
    const camera = document.getElementById('camera');
    const captureButton = document.getElementById('capture');
    let cameraStream = null;

    async function startCamera() {
        if (!window.isSecureContext && !['localhost', '127.0.0.1'].includes(location.hostname)) {
            throw new Error('Camera access requires HTTPS on a remote server.');
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        camera.srcObject = cameraStream;
        camera.onloadedmetadata = () => {
            camera.play().catch(() => {});
            captureButton.disabled = false;
            document.getElementById('cameraStatus').textContent = 'Camera ready.';
        };
    }

    captureButton.disabled = true;
    startCamera().catch(error => {
        const message = `Camera setup failed: ${error.message}`;
        document.getElementById('cameraStatus').textContent = message;
        document.getElementById('results').textContent = message;
    });

    captureButton.addEventListener('click', function (event) {
        event.preventDefault();
        if (!cameraStream || !camera.videoWidth) {
            document.getElementById('results').textContent = 'Camera is not ready yet.';
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;
        canvas.getContext('2d').drawImage(camera, 0, 0, canvas.width, canvas.height);
        const dataUri = canvas.toDataURL('image/jpeg', 0.9);
        previewImage(dataUri);
        sendImageToServer(dataUri);
    });

    function previewImage(data_uri) {
        document.getElementById('results').innerHTML = '<img src="' + data_uri + '"/>';
    }

    function sendImageToServer(data_uri) {
        const formData = new FormData(document.getElementById('myForm'));
        formData.append('imageDataURL', data_uri);

        fetch('/captureImage', {
            method: 'POST',
            body: formData
        })
            .then(async response => {
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Image capture failed');
                return result;
            })
            .then(result => {
                alert(result.message);
            })
            .catch(error => {
                console.error('Error sending data:', error);
            });
    }

    window.addEventListener('beforeunload', () => {
        if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
    });
</script>

{% endblock %}
