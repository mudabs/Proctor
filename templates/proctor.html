{% extends "proctorbase.html" %}
{% block title %}Proctoring{% endblock %}
{% block proctor %}
<h1>Proctoring</h1>
<video id="camera" autoplay muted playsinline width="640"></video>
<p id="status">Requesting camera and microphone permission…</p>
<pre id="result"></pre>
<script>
(async () => {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  try {
    const media = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    document.getElementById('camera').srcObject = media;
    const started = await fetch('/proctoring/session', {method: 'POST'});
    if (!started.ok) throw new Error('Could not start the proctoring session');
    const {session_id: id} = await started.json();
    const canvas = document.createElement('canvas');
    const video = document.getElementById('camera');
    const send = () => {
      if (!video.videoWidth) return;
      const scale = Math.min(1, 1280 / video.videoWidth, 720 / video.videoHeight);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(async blob => {
        const response = await fetch(`/proctoring/session/${id}/frame`, {method: 'POST', headers: {'Content-Type': 'image/jpeg'}, body: blob});
        if (response.ok) result.textContent = JSON.stringify(await response.json(), null, 2);
      }, 'image/jpeg', 0.75);
    };
    status.textContent = 'Camera active; frames are sent securely to this exam session.';
    setInterval(send, {{ config.get('PROCTOR_FRAME_INTERVAL_MS', 1000) }});
    window.addEventListener('beforeunload', () => fetch(`/proctoring/session/${id}`, {method: 'DELETE', keepalive: true}));
  } catch (error) {
    status.textContent = `Camera setup failed: ${error.message}`;
    await fetch('/proctoring/session/invalid/error', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({error: error.message})}).catch(() => {});
  }
})();
</script>
{% endblock %}
{% block content %}{% endblock %}
